[project]
name = "atcds"
version = "0.1.0"
description = "AI-Based Air Traffic Conflict Resolution Decision Support"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
atcds-sim = "core.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
